<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EU DPP Registry (mock){% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 1rem 2rem; color: #222; }
    h1, h2, h3 { color: #003399; }
    nav { margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 2px solid #003399; }
    nav a { margin-right: 1.5rem; color: #003399; text-decoration: none; font-weight: 600; }
    .disclaimer { background: #fdf6e3; border-left: 4px solid #d4a017; padding: 0.6rem 1rem; margin-bottom: 1.5rem; font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; }
    th { background: #f4f6f7; }
    input[type=text] { padding: 0.4rem 0.6rem; width: 60%; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 0.4rem 1rem; border-radius: 4px; cursor: pointer; border: 1px solid #003399; background: #003399; color: #fff; }
    code { background: #f4f4f4; padding: 1px 5px; border-radius: 3px; font-size: 0.85em; }
    .muted { color: #888; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'search' %}">🇪🇺 EU DPP Registry</a>
    <span class="muted">mock — indexes only, does not host DPP content</span>
  </nav>

  <div class="disclaimer">
    This is a self-contained mock of
    <a href="https://single-market-economy.ec.europa.eu/single-market/digital-product-passport/dpp-registry_en">the EU DPP Registry</a>
    built for this demonstrator. It is not affiliated with or endorsed by the European Commission.
  </div>

  {% block content %}{% endblock %}
</body>
</html>
