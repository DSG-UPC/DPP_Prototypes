{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NeoCycleHub</title>
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/dashboard.css' %}" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f5f5f5;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #56beac;
      letter-spacing: 1px;
    }
    .login-header p {
      color: #888;
      font-size: 0.9rem;
      margin: 0;
    }
    .btn-login {
      background-color: #56beac;
      border-color: #56beac;
      color: #fff;
      font-weight: 700;
      width: 100%;
      padding: 0.6rem;
    }
    .btn-login:hover {
      background-color: #3da896;
      border-color: #3da896;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1>NEOCYCLEHUB</h1>
      <p>UNTP v0.7.0 Demonstrator</p>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger" role="alert">
      Incorrect username or password. Please try again.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label fw-semibold">Username</label>
        <input type="text" name="username" id="id_username"
               class="form-control" autofocus autocomplete="username" required>
      </div>
      <div class="mb-4">
        <label for="id_password" class="form-label fw-semibold">Password</label>
        <input type="password" name="password" id="id_password"
               class="form-control" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-login">Sign in</button>
    </form>
  </div>
</body>
</html>
