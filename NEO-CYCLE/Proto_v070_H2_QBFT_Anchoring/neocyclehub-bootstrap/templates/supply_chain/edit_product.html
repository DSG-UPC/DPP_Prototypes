{% extends "base.html" %}
{% block title %}Edit {{ product.name }} — NeoCycleHub{% endblock %}
{% block content %}

<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
  <h1 class="h2"><i class="bi bi-pencil me-2"></i>Edit product: {{ product.name }}</h1>
  <a href="{% url 'actor_detail' product.actor.pk %}" class="btn btn-sm btn-grey">
    <i class="bi bi-arrow-left me-1"></i>Back
  </a>
</div>

<div class="card shadow-sm" style="max-width:820px">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Name</label>
        <input name="name" value="{{ product.name }}" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="3">{{ product.description }}</textarea>
      </div>
      <div class="row">
        <div class="col-md-8 mb-3">
          <label class="form-label fw-semibold">GTIN (GS1 identifier URL)</label>
          <input name="gtin" value="{{ product.gtin }}" class="form-control font-monospace">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label fw-semibold">Model number</label>
          <input name="model_number" value="{{ product.model_number }}" class="form-control">
        </div>
      </div>
      <div class="row">
        <div class="col-md-8 mb-3">
          <label class="form-label fw-semibold">ID scheme URI <span class="text-muted fw-normal">(UNTP <code>idScheme.id</code>)</span></label>
          <input name="id_scheme_id" value="{{ product.id_scheme_id }}" class="form-control font-monospace"
                 placeholder="https://id.gs1.org/01/ (default if blank)">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label fw-semibold">ID scheme name <span class="text-muted fw-normal">(<code>idScheme.name</code>)</span></label>
          <input name="id_scheme_name" value="{{ product.id_scheme_name }}" class="form-control"
                 placeholder="Global Trade Identification Number (GTIN)">
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Batch number</label>
          <input name="batch_number" value="{{ product.batch_number }}" class="form-control">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">ID granularity</label>
          <input name="id_granularity" value="{{ product.id_granularity }}" class="form-control">
        </div>
      </div>
      <div class="row">
        <div class="col-md-3 mb-3">
          <label class="form-label fw-semibold">CPC code</label>
          <input name="cpc_code" value="{{ product.cpc_code }}" class="form-control">
        </div>
        <div class="col-md-9 mb-3">
          <label class="form-label fw-semibold">CPC name</label>
          <input name="cpc_name" value="{{ product.cpc_name }}" class="form-control">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Facility name override <span class="text-muted fw-normal">(UNTP <code>producedAtFacility.name</code>)</span></label>
        <input name="facility_name_override" value="{{ product.facility_name_override }}" class="form-control"
               placeholder="{{ product.actor.name }} — Main Facility (default if blank)">
      </div>
      <hr>
      <p class="text-muted small">Upstream process (UNTP <code>characteristics.upstreamProcess</code> extension)</p>
      <div class="row">
        <div class="col-md-3 mb-3">
          <label class="form-label fw-semibold">Type</label>
          <select name="upstream_process_type" class="form-select">
            <option value="" {% if not product.upstream_process_type %}selected{% endif %}>—</option>
            <option value="SSC" {% if product.upstream_process_type == 'SSC' %}selected{% endif %}>SSC</option>
            <option value="SENE" {% if product.upstream_process_type == 'SENE' %}selected{% endif %}>SENE</option>
          </select>
        </div>
        <div class="col-md-5 mb-3">
          <label class="form-label fw-semibold">Source material</label>
          <input name="upstream_source_material" value="{{ product.upstream_source_material }}" class="form-control">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label fw-semibold">Source batch</label>
          <input name="upstream_source_batch" value="{{ product.upstream_source_batch }}" class="form-control">
        </div>
      </div>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label fw-semibold">Process date</label>
          <input type="date" name="upstream_process_date" value="{{ product.upstream_process_date|date:'Y-m-d' }}" class="form-control">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label fw-semibold">Recycled mass fraction</label>
          <input type="number" step="0.01" min="0" max="1" name="recycled_mass_fraction"
                 value="{{ product.recycled_mass_fraction|default_if_none:'' }}" class="form-control">
          <div class="form-text">0.0–1.0</div>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-green-admin" type="submit">
          <i class="bi bi-check-lg me-1"></i>Save
        </button>
        <a href="{% url 'actor_detail' product.actor.pk %}" class="btn btn-grey">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
